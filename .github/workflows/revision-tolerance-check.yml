name: Revision Tolerance Check

on:
  workflow_dispatch:

jobs:
  tolerance:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Run signoff and generate metrics
        shell: powershell
        run: .\run_signoff_week13_14.ps1 -OutputDir artifacts/runs/ci-tolerance

      - name: Run advanced real corpus gate
        shell: powershell
        run: .\run_advanced_real_corpus_gate.ps1 -Manifest advanced_real_corpus_manifest.json -Mode pure -DefaultMaxHalfCycles 700000 -ReportCsv advanced_real_corpus_runtime.csv -OutputDir artifacts/runs/ci-tolerance

      - name: Run advanced DOS recovery gate
        shell: powershell
        run: .\run_advanced_dos_recovery_gate.ps1 -Manifest advanced_dos_recovery_manifest.json -Profile fast -ExternalManifest external_tests_manifest.json -ReportCsv advanced_dos_recovery_runtime.csv -OutputDir artifacts/runs/ci-tolerance

      - name: Run phase5 soak gate
        shell: powershell
        run: .\run_phase5_soak_gate.ps1 -Manifest external_tests_manifest.json -Runs 12 -MaxFlakeRate 0.05 -ReportCsv phase5_soak_runtime.csv -OutputDir artifacts/runs/ci-tolerance

      - name: Check phase5 hard thresholds
        shell: powershell
        run: .\run_check_phase5_hard_thresholds.ps1 -Thresholds phase5_hard_thresholds.json -Matrix copier_matrix.json -Report artifacts/runs/ci-tolerance/copier_matrix_signoff_report.json -AdvancedRealCorpusReport artifacts/runs/ci-tolerance/advanced_real_corpus_runtime.csv -AdvancedDosRecoveryReport artifacts/runs/ci-tolerance/advanced_dos_recovery_runtime.csv -SoakReport artifacts/runs/ci-tolerance/phase5_soak_runtime.csv -RevisionMetrics reference/edge/revision_tolerance_metrics.json -PromotionReportJson reference/edge/level1_vs_level2_vs_level3.json -PromotionReportCsv reference/edge/level1_vs_level2_vs_level3.csv

      - name: Check tolerance policy
        shell: powershell
        run: .\run_check_revision_tolerance.ps1

      - name: Check phase5 closure gate
        shell: powershell
        run: .\run_check_phase5_closure.ps1 -ReportPath artifacts/runs/ci-tolerance/copier_matrix_signoff_report.json -ChecklistPath artifacts/runs/ci-tolerance/COPIER_SUPPORT_MATRIX.md -GenerateChecklist

      - name: Upload tolerance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-tolerance-artifacts
          path: |
            artifacts/runs/ci-tolerance/copier_matrix_signoff_report.json
            artifacts/runs/ci-tolerance/copier_matrix_signoff_report.csv
            artifacts/runs/ci-tolerance/advanced_real_corpus_runtime.csv
            artifacts/runs/ci-tolerance/advanced_dos_recovery_runtime.csv
            artifacts/runs/ci-tolerance/phase5_soak_runtime.csv
            artifacts/runs/ci-tolerance/COPIER_SUPPORT_MATRIX.md
            artifacts/runs/ci-tolerance/real_golden_gate_runtime.csv
            reference/edge/revision_tolerance_metrics.json
            reference/edge/level_promotion_signoff.json
            reference/edge/level_promotion_signoff.csv
            reference/edge/level1_vs_level2_vs_level3.json
            reference/edge/level1_vs_level2_vs_level3.csv
