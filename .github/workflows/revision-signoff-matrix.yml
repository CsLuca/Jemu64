name: Revision Signoff Matrix

on:
  workflow_dispatch:

jobs:
  signoff-revisions:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rev:
          - name: nmos
            slot: 6510
            cpu: 6510
            vic: 6569
            cia: 6526
            openbus: nmos
            drive: 1541
            manifest_strict: external_tests_golden_corpus_6510.json
            manifest_fast: external_tests_golden_corpus_6510_fast.json
          - name: hmos
            slot: 8500
            cpu: 8500
            vic: 8565
            cia: 6526A
            openbus: hmos
            drive: 1541C
            manifest_strict: external_tests_golden_corpus_8500.json
            manifest_fast: external_tests_golden_corpus_8500_fast.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Run signoff matrix (${{ matrix.rev.name }})
        shell: powershell
        run: |
          .\run_signoff_week13_14.ps1 `
            -Manifest "${{ matrix.rev.manifest_strict }}" `
            -FastManifest "${{ matrix.rev.manifest_fast }}" `
            -Manifest6510 "${{ matrix.rev.manifest_strict }}" `
            -Manifest8500 "${{ matrix.rev.manifest_strict }}" `
            -FastManifest6510 "${{ matrix.rev.manifest_fast }}" `
            -FastManifest8500 "${{ matrix.rev.manifest_fast }}" `
            -RevisionSlot "${{ matrix.rev.slot }}"

      - name: Run advanced real corpus gate (${{ matrix.rev.name }})
        shell: powershell
        run: .\run_advanced_real_corpus_gate.ps1 -Manifest advanced_real_corpus_manifest.json -Mode pure -DefaultMaxHalfCycles 700000 -ReportCsv advanced_real_corpus_runtime.csv

      - name: Run advanced DOS recovery gate (${{ matrix.rev.name }})
        shell: powershell
        run: .\run_advanced_dos_recovery_gate.ps1 -Manifest advanced_dos_recovery_manifest.json -Profile fast -ExternalManifest external_tests_manifest.json -ReportCsv advanced_dos_recovery_runtime.csv

      - name: Run phase5 soak gate (${{ matrix.rev.name }})
        shell: powershell
        run: .\run_phase5_soak_gate.ps1 -Manifest external_tests_manifest.json -Runs 6 -MaxFlakeRate 0.05 -ReportCsv phase5_soak_runtime.csv

      - name: Check phase5 hard thresholds (${{ matrix.rev.name }})
        shell: powershell
        run: .\run_check_phase5_hard_thresholds.ps1 -Thresholds phase5_hard_thresholds.json -Matrix copier_matrix.json -Report copier_matrix_report.json

      - name: Check phase5 closure gate (${{ matrix.rev.name }})
        shell: powershell
        run: .\run_check_phase5_closure.ps1 -GenerateChecklist

      - name: Upload signoff artifacts (${{ matrix.rev.name }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-signoff-${{ matrix.rev.name }}
          path: |
            copier_matrix_report.json
            copier_matrix_report.csv
            advanced_real_corpus_runtime.csv
            advanced_dos_recovery_runtime.csv
            phase5_soak_runtime.csv
            COPIER_SUPPORT_MATRIX.md
            real_golden_gate_runtime.csv
            reference/edge/revision_tolerance_metrics.json
