name: Revision Signoff Matrix

on:
  workflow_dispatch:

jobs:
  signoff-revisions:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rev:
          - name: nmos
            slot: 6510
            cpu: 6510
            vic: 6569
            cia: 6526
            openbus: nmos
            drive: 1541
            manifest_strict: external_tests_golden_corpus_6510.json
            manifest_fast: external_tests_golden_corpus_6510_fast.json
          - name: hmos
            slot: 8500
            cpu: 8500
            vic: 8565
            cia: 6526A
            openbus: hmos
            drive: 1541C
            manifest_strict: external_tests_golden_corpus_8500.json
            manifest_fast: external_tests_golden_corpus_8500_fast.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Run signoff matrix (${{ matrix.rev.name }})
        shell: powershell
        run: |
          $outDir = "artifacts/runs/ci-signoff-${{ matrix.rev.name }}"
          .\run_signoff_week13_14.ps1 `
            -Manifest "${{ matrix.rev.manifest_strict }}" `
            -FastManifest "${{ matrix.rev.manifest_fast }}" `
            -Manifest6510 "${{ matrix.rev.manifest_strict }}" `
            -Manifest8500 "${{ matrix.rev.manifest_strict }}" `
            -FastManifest6510 "${{ matrix.rev.manifest_fast }}" `
            -FastManifest8500 "${{ matrix.rev.manifest_fast }}" `
            -RevisionSlot "${{ matrix.rev.slot }}" `
            -OutputDir $outDir

      - name: Run advanced real corpus gate (${{ matrix.rev.name }})
        shell: powershell
        run: .\run_advanced_real_corpus_gate.ps1 -Manifest advanced_real_corpus_manifest.json -Mode pure -DefaultMaxHalfCycles 700000 -ReportCsv advanced_real_corpus_runtime.csv -OutputDir "artifacts/runs/ci-signoff-${{ matrix.rev.name }}"

      - name: Run advanced DOS recovery gate (${{ matrix.rev.name }})
        shell: powershell
        run: .\run_advanced_dos_recovery_gate.ps1 -Manifest advanced_dos_recovery_manifest.json -Profile fast -ExternalManifest external_tests_manifest.json -ReportCsv advanced_dos_recovery_runtime.csv -OutputDir "artifacts/runs/ci-signoff-${{ matrix.rev.name }}"

      - name: Run phase5 soak gate (${{ matrix.rev.name }})
        shell: powershell
        run: .\run_phase5_soak_gate.ps1 -Manifest external_tests_manifest.json -Runs 12 -MaxFlakeRate 0.05 -ReportCsv phase5_soak_runtime.csv -OutputDir "artifacts/runs/ci-signoff-${{ matrix.rev.name }}"

      - name: Run Level4 KPI gate (${{ matrix.rev.name }})
        shell: powershell
        run: .\run_level4_kpi_gate.ps1 -PathologicalManifest level4_pathological_corpus_manifest.json -AdvancedManifest advanced_real_corpus_manifest.json -RealGoldenManifest real_golden_manifest.json -DosRecoveryManifest advanced_dos_recovery_manifest.json -ExternalManifest external_tests_manifest.json -ReportCsv level4_kpi_gate_runtime.csv -KpiJson level4_kpi_metrics.json -OutputDir "artifacts/runs/ci-signoff-${{ matrix.rev.name }}"

      - name: Run Level4 chaos soak (${{ matrix.rev.name }})
        shell: powershell
        run: .\run_level4_chaos_soak.ps1 -ExternalManifest external_tests_manifest.json -Runs 12 -MaxFlakeRate 0.05 -ReportCsv level4_chaos_soak_runtime.csv -OutputDir "artifacts/runs/ci-signoff-${{ matrix.rev.name }}"

      - name: Check phase5 hard thresholds (${{ matrix.rev.name }})
        shell: powershell
        run: .\run_check_phase5_hard_thresholds.ps1 -Thresholds phase5_hard_thresholds.json -Matrix copier_matrix.json -Report "artifacts/runs/ci-signoff-${{ matrix.rev.name }}/copier_matrix_signoff_report.json" -AdvancedRealCorpusReport "artifacts/runs/ci-signoff-${{ matrix.rev.name }}/advanced_real_corpus_runtime.csv" -AdvancedDosRecoveryReport "artifacts/runs/ci-signoff-${{ matrix.rev.name }}/advanced_dos_recovery_runtime.csv" -SoakReport "artifacts/runs/ci-signoff-${{ matrix.rev.name }}/phase5_soak_runtime.csv" -RevisionMetrics reference/edge/revision_tolerance_metrics.json -PromotionReportJson reference/edge/level1_vs_level2_vs_level3.json -PromotionReportCsv reference/edge/level1_vs_level2_vs_level3.csv

      - name: Check phase5 closure gate (${{ matrix.rev.name }})
        shell: powershell
        run: .\run_check_phase5_closure.ps1 -ReportPath "artifacts/runs/ci-signoff-${{ matrix.rev.name }}/copier_matrix_signoff_report.json" -ChecklistPath "artifacts/runs/ci-signoff-${{ matrix.rev.name }}/COPIER_SUPPORT_MATRIX.md" -GenerateChecklist

      - name: Upload signoff artifacts (${{ matrix.rev.name }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-signoff-${{ matrix.rev.name }}
          path: |
            artifacts/runs/ci-signoff-${{ matrix.rev.name }}/copier_matrix_signoff_report.json
            artifacts/runs/ci-signoff-${{ matrix.rev.name }}/copier_matrix_signoff_report.csv
            artifacts/runs/ci-signoff-${{ matrix.rev.name }}/advanced_real_corpus_runtime.csv
            artifacts/runs/ci-signoff-${{ matrix.rev.name }}/advanced_dos_recovery_runtime.csv
            artifacts/runs/ci-signoff-${{ matrix.rev.name }}/phase5_soak_runtime.csv
            artifacts/runs/ci-signoff-${{ matrix.rev.name }}/level4_pathological_runtime.csv
            artifacts/runs/ci-signoff-${{ matrix.rev.name }}/level4_kpi_gate_runtime.csv
            artifacts/runs/ci-signoff-${{ matrix.rev.name }}/level4_kpi_metrics.json
            artifacts/runs/ci-signoff-${{ matrix.rev.name }}/level4_chaos_soak_runtime.csv
            artifacts/runs/ci-signoff-${{ matrix.rev.name }}/COPIER_SUPPORT_MATRIX.md
            artifacts/runs/ci-signoff-${{ matrix.rev.name }}/real_golden_gate_runtime.csv
            reference/edge/revision_tolerance_metrics.json
            reference/edge/level_promotion_signoff.json
            reference/edge/level_promotion_signoff.csv
            reference/edge/level1_vs_level2_vs_level3.json
            reference/edge/level1_vs_level2_vs_level3.csv
