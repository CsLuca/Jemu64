name: PLA Snapshot Check

on:
  workflow_dispatch:

jobs:
  pla-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check PLA snapshot digest
        shell: powershell
        run: .\run_check_pla_snapshot.ps1
